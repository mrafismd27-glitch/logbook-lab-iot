name: logbook_lab_iot
description: "A new Flutter project for IoT Lab Logbook using Web3 and Sepolia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.2
  web3dart: ^2.7.3  # Ubah ke 2.7.3 di sini
  http: ^1.6.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env